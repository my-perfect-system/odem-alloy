---

- name: Render cadvisor.alloy
  ansible.builtin.template:
    src: cadvisor.alloy.j2
    dest: "{{ base_config_dir }}/cadvisor.alloy"
    owner: root
    group: "{{ user_default_admin_group }}"
    mode: "0664"
  become: true
  notify: Restart alloy

- name: Add alloy user to docker group
  ansible.builtin.user:
    name: "{{ base_user }}"
    groups: docker
    append: true
  become: true
