---

# Feature toggles — naming pattern: install_enable_<feature>

install_enable_change_user: false
install_enable_livedebugging: true
install_enable_purge_config: true
install_enable_self_collector: true
install_enable_web_ui: true

# Regular configuration
# Shared alloy_* variables (user, config_dir, ports, labels, remotes)
# come from the odem.alloy.base dependency. Only install-specific
# variables are declared here.

# User the alloy systemd service runs as when install_enable_change_user
# is enabled (the packaged unit defaults to the "alloy" user).
install_service_user: root
