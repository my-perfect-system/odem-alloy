---
argument_specs:
  main:
    short_description: Install Grafana Alloy agent and base configuration
    description:
      - Installs the Grafana Alloy agent from the official Grafana apt
        repository and deploys the base River config fragments
        (alloy_logging.alloy + alloy_remotes.alloy + alloy_self.alloy)
        plus the /etc/default/alloy env file.
      - All *.alloy fragments are purged before re-rendering so stale or
        disabled features are cleaned up on the next run, gated by
        install_enable_purge_config.
      - Only stdlib and ansible.posix collections are required on top of
        odem.base.
      - Shared base_* variables (user, config dir, ports, labels, remotes)
        are provided by the odem.alloy.base dependency.
    options:
      install_enable_change_user:
        type: bool
        required: false
        default: false
        description: >-
          When true, change the User= line in /usr/lib/systemd/system/alloy.service
          to install_service_user (default root), so the agent runs with full
          privileges instead of the packaged non-root "alloy" user.
      install_service_user:
        type: str
        required: false
        default: root
        description: "User the alloy systemd service runs as when install_enable_change_user is enabled"
      install_enable_livedebugging:
        type: bool
        required: false
        default: true
        description: >-
          Value written to the alloy_livedebugging.alloy fragment, enabling
          (true) or disabling (false, Alloy's own default) live debugging in
          the Alloy web UI. The fragment is always rendered so the value is
          enforced on every run.
      install_enable_purge_config:
        type: bool
        required: false
        default: true
        description: >-
          When true, remove every *.alloy file in the Alloy config dir before
          rendering this role's fragments, so stale or disabled fragments are
          cleaned up. When false, existing files are left in place.
      install_enable_self_collector:
        type: bool
        required: false
        default: true
        description: >-
          When true, render alloy_self.alloy, scraping Alloy's own
          prometheus.exporter.self metrics into the Mimir remote_write. When
          false, the fragment is skipped and cleaned up on the next run.
      install_enable_web_ui:
        type: bool
        required: false
        default: true
        description: >-
          When true, render CUSTOM_ARGS with
          --server.http.listen-addr=0.0.0.0:<base_web_ui_port> in the alloy
          env file so the web UI is reachable from the network. When false,
          the CUSTOM_ARGS line is omitted and Alloy keeps its packaged default
          (loopback-only UI on 127.0.0.1:12345).
