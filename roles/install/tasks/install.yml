---

- name: Install gpg package
  ansible.builtin.apt:
    name: gpg
    state: present
    update_cache: true
  become: true

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download Grafana apt signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg-full.key
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: "0644"
    force: true
  become: true

- name: Add Grafana apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/grafana.asc]
      https://apt.grafana.com stable main
    filename: grafana
    state: present
    update_cache: true
  become: true

- name: Install alloy package
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true
  become: true

- name: Create alloy state directory
  ansible.builtin.file:
    path: /var/lib/alloy
    state: directory
    owner: "{{ base_user }}"
    group: "{{ user_default_admin_group }}"
    recurse: true
  become: true

- name: Render alloy default env file
  ansible.builtin.template:
    src: alloy.default.j2
    dest: "{{ base_env_file }}"
    owner: root
    group: "{{ user_default_admin_group }}"
    mode: "0664"
  become: true
  notify: Restart alloy

- name: Change alloy service user
  ansible.builtin.lineinfile:
    path: /usr/lib/systemd/system/alloy.service
    regexp: '^User='
    line: "User={{ install_service_user }}"
    state: present
  become: true
  notify: Restart alloy
  when: install_enable_change_user | bool

- name: Enable and start alloy service
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started
    daemon_reload: true
  become: true
