---

- name: Render proxy_metrics_{{ target.name }}.alloy
  ansible.builtin.template:
    src: proxy_metrics.alloy.j2
    dest: "{{ base_config_dir }}/proxy_metrics_{{ target.name }}.alloy"
    owner: root
    group: "{{ user_default_admin_group }}"
    mode: "0664"
  become: true
  notify: Restart alloy