---
argument_specs:
  main:
    short_description: Docker container metrics and logs collection for Alloy
    description:
      - Deploys the Docker telemetry River fragments, i.e. docker_metrics.alloy
        (system-wide cAdvisor exporter over the Docker socket) and
        docker_logs.alloy (Docker log collection to Loki).
      - Each fragment is gated by its own docker_enable_<feature> toggle.
    options:
      docker_enable_logs:
        type: bool
        required: false
        default: true
        description: "Deploy the docker_logs.alloy fragment (container logs to Loki)"
      docker_enable_metrics:
        type: bool
        required: false
        default: true
        description: "Deploy the docker_metrics.alloy fragment (system-wide cAdvisor metric scraping)"
      docker_cadvisor_storage_duration:
        type: str
        required: false
        default: "5m"
        description: "cAdvisor storage_duration (window of per-container metrics kept in memory)"
      docker_cadvisor_scrape_interval:
        type: str
        required: false
        default: "60s"
        description: "Scrape interval for the cAdvisor prometheus.scrape component"
