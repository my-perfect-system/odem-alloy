---

- name: Configure docker logs
  ansible.builtin.include_tasks: configure_docker_logs.yml
  when: docker_enable_logs | bool

- name: Configure docker metrics
  ansible.builtin.include_tasks: configure_docker_metrics.yml
  when: docker_enable_metrics | bool

- name: Configure cadvisor service
  ansible.builtin.include_tasks: configure_cadvisor_service.yml
  when: docker_enable_cadvisor_service | bool
