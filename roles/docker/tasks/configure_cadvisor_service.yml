---
- name: Ensure cadvisor compose directory exists
  ansible.builtin.file:
    path: "{{ docker_cadvisor_compose_dir }}"
    state: directory
    owner: root
    group: "{{ user_default_admin_group }}"
    mode: "2775"
  become: true

- name: Render cadvisor docker compose
  ansible.builtin.template:
    src: cadvisor-compose.yml.j2
    dest: "{{ docker_cadvisor_compose_dir }}/docker-compose.yml"
    owner: root
    group: "{{ user_default_admin_group }}"
    mode: "0664"
  become: true

- name: Start cadvisor service
  ansible.builtin.shell: |
    docker compose up -d
  args:
    chdir: "{{ docker_cadvisor_compose_dir }}"
  become: true
  changed_when: false
