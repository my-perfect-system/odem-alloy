---
# Feature toggles — naming pattern: docker_enable_<feature>

docker_enable_logs: true

docker_enable_metrics: true

docker_enable_cadvisor_service: true

# Regular configuration

docker_cadvisor_image: "gcr.io/cadvisor/cadvisor:v0.51.0"

docker_cadvisor_compose_dir: "/etc/alloy/cadvisor"

docker_cadvisor_port: "8080"

docker_cadvisor_scrape_interval: "60s"

docker_cadvisor_storage_duration: "5m"

docker_cadvisor_enabled_metrics:
  - app
  - cpu
  - cpuLoad
  - disk
  - diskIO
  - memory
  - network
  - oom_event
  - percpu
  - perf_event
  - sched
  - advtcp
  - cpu_topology
  - cpuset
  - hugetlb
  - memory_numa
  - process
  - tcp
  - udp
