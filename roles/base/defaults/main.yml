---

# Shared identity + agent configuration for the odem.alloy roles.
#
# This role is declared as a meta dependency by every other role in the
# collection, so these variables constitute the single source of truth
# for the Alloy agent across all fragment roles. Do not re-declare them
# in child roles — override per-host via host_vars / group_vars instead.

base_user: alloy
base_config_dir: /etc/alloy
base_env_file: /etc/default/alloy
base_web_ui_port: 12345
base_metrics_port: 9400
base_custom_labels: "os=debian13,systype=hw,physloc=de"
base_remote_prometheus_url: "http://10.10.100.180:9090/api/v1/write"
base_remote_loki_url: "http://10.10.100.180:3100/loki/api/v1/push"
